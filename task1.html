<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --green: #0F6B5F;
      --orange: #F2A93B;
      --ink: #16302B;
      --field: #F4F7F5;
      --line: #E6EFEC;
    }
    body {
      font-family: "Montserrat", sans-serif;
      color: var(--ink);
      background: var(--line);
      min-height: 100vh;
    }
    .ticket-card {
      border: 0;
      border-radius: 1.25rem;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1rem 2.5rem rgba(15, 107, 95, .18);
    }
    .ticket-card .card-header {
      background: var(--green);
      color: #fff;
      border: 0;
      padding: 1.5rem 1.5rem;
      font-weight: 700;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
    }
    .ticket-card .card-body { padding: clamp(1rem, 4vw, 2.5rem); }

    .form-label, .col-form-label, legend.form-label { font-weight: 600; font-size: .8rem; color: var(--ink); margin-bottom: .35rem; }
    .form-control, .form-select {
      background-color: var(--field);
      border: 1px solid var(--line);
      border-radius: .6rem;
      color: var(--ink);
      font-size: .8rem;
      font-family: inherit;
    }
    .form-control::placeholder { color: #8a9a96; opacity: 1; }
    .form-control:focus, .form-select:focus {
      background-color: #fff;
      border-color: var(--green);
      box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2);
    }

    /* floating labels that always stay small, with the placeholder visible */
    .form-floating > .form-control { height: calc(3rem + 2px); padding-top: 1.35rem; padding-bottom: .3rem; }
    .form-floating > .form-control::placeholder { color: var(--ink); opacity: .85; }
    .form-floating > label {
      font-size: .8rem; color: #7b8d88;
      transform: scale(.8) translateY(-.5rem) translateX(.15rem);
      opacity: 1;
    }

    /* trip type: two radios shown as a pill toggle */
    .trip-toggle { border-radius: 2rem; border: 1px solid var(--green); overflow: hidden; }
    .trip-toggle .btn {
      border: 0; border-radius: 0; font-weight: 600; font-size: .8rem;
      color: var(--green); background: #fff; padding: .45rem 1.1rem;
    }
    .trip-toggle .btn-check:checked + .btn { background: var(--green); color: #fff; }
    .trip-toggle .btn-check:focus-visible + .btn { outline: 3px solid var(--orange); outline-offset: -3px; }

    /* radios / checkbox / switch */
    .form-check-input:checked { background-color: var(--green); border-color: var(--green); }
    .form-check-input:focus { border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .25); }
    .form-check-label { font-size: .75rem; }

    /* phone prefix */
    .input-group-text.prefix {
      background: var(--green); color: #fff; border: 1px solid var(--green);
      border-radius: .6rem 0 0 .6rem; font-weight: 700; font-size: .8rem;
    }
    .input-group > .form-control { border-radius: 0 .6rem .6rem 0; }

    /* buttons */
    .btn-find, .btn-clear {
      border-radius: 2rem; font-weight: 700; font-size: .85rem; padding: .6rem 1.6rem; font-family: inherit;
    }
    .btn-find { background: var(--orange); border: 2px solid var(--orange); color: #fff; }
    .btn-find:hover, .btn-find:focus-visible { background: #e29a28; border-color: #e29a28; color: #fff; }
    .btn-clear { background: #fff; border: 1px solid var(--ink); color: var(--ink); }
    .btn-clear:hover, .btn-clear:focus-visible { background: var(--ink); color: #fff; }
    .btn:focus-visible { box-shadow: 0 0 0 .25rem rgba(15, 107, 95, .35); }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-11 col-xl-10">
        <section class="card ticket-card">
          <div class="card-header"><h1 class="h5 m-0 fw-bold">Book a train ticket</h1></div>
          <div class="card-body">
            <form action="#" method="get">

              <!-- One way / Round trip: two radio inputs (Bootstrap "Checkbox & radio toggle buttons") -->
              <fieldset class="mb-4">
                <legend class="visually-hidden">Trip type</legend>
                <div class="btn-group trip-toggle" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="oneway" value="one-way" checked>
                  <label class="btn" for="oneway">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="round" value="round-trip">
                  <label class="btn" for="round">Round trip</label>
                </div>
              </fieldset>

              <div class="row g-3">
                <!-- Floating labels -->
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="from" name="from" placeholder="Astana" required autocomplete="off">
                    <label for="from">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" required autocomplete="off">
                    <label for="to">To</label>
                  </div>
                </div>

                <!-- Date inputs + Select -->
                <div class="col-12 col-md-4">
                  <label for="departure" class="form-label">Departure</label>
                  <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="return" class="form-label">Return</label>
                  <input type="date" class="form-control" id="return" name="return">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">Passengers</label>
                  <select class="form-select" id="passengers" name="passengers">
                    <option value="1" selected>1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>

                <!-- Inline radios -->
                <div class="col-12">
                  <fieldset>
                    <legend class="form-label">Carriage class</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                      <label class="form-check-label" for="seat">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe">
                      <label class="form-check-label" for="coupe">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                      <label class="form-check-label" for="sleeper">Sleeper</label>
                    </div>
                  </fieldset>
                </div>

                <!-- Input group -->
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text prefix" id="phone-prefix">+7</span>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78"
                           inputmode="tel" autocomplete="tel-national" aria-describedby="phone-prefix"
                           pattern="[0-9 ]{10,13}" title="10 digits, for example 701 234 56 78" required>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <!-- Switch + checkbox -->
                <div class="col-12">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                    <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                    <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                  </div>
                </div>

                <!-- HTML order: Clear, Find trains. On phones column-reverse puts "Find trains" on top -->
                <div class="col-12">
                  <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 mt-2">
                    <button type="reset" class="btn btn-clear">Clear</button>
                    <button type="submit" class="btn btn-find">Find trains</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
